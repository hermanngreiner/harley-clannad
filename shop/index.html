<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clubshop</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" sizes="180x180" href="https://hermanngreiner.github.io/harley-clannad/shop/apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="manifest" href="manifest.webmanifest?v=3">
<!-- Verbindung zu Google schon aufbauen, während die Seite lädt -->
<link rel="preconnect" href="https://harley-clannad-ostalb.de">
<link rel="stylesheet" href="../start.css">
</head>
<body>
<main>
  <img class="logo" src="icon-192.png" width="112" height="112" alt="">
  <h1>Clubshop</h1>
  <p class="club">Harley Clannad Ostalb e.V.</p>
  <a id="go" class="button" href="#">Shop öffnen</a>
  <section id="howto" class="howto hidden"></section>
</main>
<script>
// Rundenlink aus WhatsApp (#runde=CODE): merkt sich den Namen (gemeinsam mit dem Kalender) und öffnet den
// Shop auf dem eigenen Server mit Runde und Namen. Keine Anleitung, sofort weiter.
var TARGET = 'https://harley-clannad-ostalb.de/shop/';
var NAME = 'Clubshop';
var TARGET_LABEL = 'den Shop';
var NEEDS_NAME = true;
var NAMES_PARAM = 'runde';
var ALWAYS_REDIRECT = true;
// Shop im Rahmen zeigen statt weiterzuleiten
var EMBED = true;
</script>
<script src="../start.js"></script>
</body>
</html>
